<!doctype html>
<html lang="es" data-skin="v2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChartBay · Acceso</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23111'/%3E%3Cpolyline%20points='6,23%2013,15%2018,18%2026,7'%20fill='none'%20stroke='%230a7a0a'%20stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='redesign.css') }}">
</head>
<body>
  <div class="login-wrap">
    <svg class="ship" viewBox="0 0 160 120" aria-hidden="true">
      <path d="M10 104 q12 -7 24 0 t24 0 t24 0 t24 0 t24 0"/>
      <path d="M10 112 q12 -7 24 0 t24 0 t24 0 t24 0 t24 0"/>
      <path class="hull" d="M28 92 L132 92 L118 107 Q80 117 42 107 Z"/>
      <line x1="80" y1="92" x2="80" y2="10"/>
      <path class="flagbg" d="M80 8 L117 6 Q122 17 117 28 L80 30 Z"/>
      <circle class="jolly" cx="98" cy="15" r="4"/>
      <circle class="eye" cx="96.4" cy="14.6" r="0.9"/>
      <circle class="eye" cx="99.6" cy="14.6" r="0.9"/>
      <rect class="jolly" x="96" y="18" width="4" height="1.8"/>
      <line class="jolly-line" x1="92" y1="27" x2="104" y2="20"/>
      <line class="jolly-line" x1="92" y1="20" x2="104" y2="27"/>
      <line x1="50" y1="40" x2="34" y2="90"/>
      <line x1="110" y1="40" x2="126" y2="90"/>
      <line x1="50" y1="40" x2="110" y2="40"/>
      <path class="sail" d="M54 41 Q80 49 106 41 L101 80 Q80 88 59 80 Z"/>
      <polyline class="chart" points="60 74 69 65 77 69 87 54 97 58"/>
      <path class="chart" d="M97 58 l-7 0 m7 0 l0 7"/>
    </svg>
    <h1 class="wordmark">Chart<span class="bay">Bay</span></h1>
    <p class="tagline">Acceso a terminal de análisis técnico y cuantitativo</p>

    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}

    <form class="login-form" method="post">
      <label>Usuario
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>Contraseña
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
    {% if registration_open %}
    <p style="margin-top:16px;font-size:11px">¿Aún sin cuenta? <a href="{{ url_for('register') }}">Crear cuenta</a></p>
    {% else %}
    <p style="margin-top:16px;font-size:11px;color:#888">Registro cerrado (versión alfa).</p>
    {% endif %}
  </div>
</body>
</html>
