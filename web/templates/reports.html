<!doctype html>
<html lang="es" data-skin="v2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChartBay · Reportes</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23111'/%3E%3Cpolyline%20points='6,23%2013,15%2018,18%2026,7'%20fill='none'%20stroke='%230a7a0a'%20stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='redesign.css') }}">
</head>
<body>
  {% set active = '' %}
  {% include '_topbar_v2.html' with context %}
  <div class="wrap">
    <hr class="rule">
    <p class="catalog-title">Reportes archivados</p>
    {% if files %}
      <ul class="report-list">
        {% for f in files %}
          <li><a href="{{ url_for('report_view', name=f) }}">{{ f }}</a></li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="muted" style="text-align:center">Aún no hay bitácoras archivadas. Se generan cada
        mañana de mercado, o con <code>python main.py</code>.</p>
    {% endif %}
  </div>
</body>
</html>
