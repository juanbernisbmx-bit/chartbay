<!doctype html>
<html lang="es" data-skin="v2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChartBay · Publicar bot</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23111'/%3E%3Cpolyline%20points='6,23%2013,15%2018,18%2026,7'%20fill='none'%20stroke='%230a7a0a'%20stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='redesign.css') }}">
</head>
<body>
  {% set active = '' %}
  {% include '_topbar_v2.html' with context %}
  <div class="wrap">
    <p class="catalog-title">Publicar ficha de bot</p>
    {% if error %}<p class="err" style="text-align:center">{{ error }}</p>{% endif %}
    <form class="botform" method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label>Nombre del bot
        <input type="text" name="name" maxlength="80" required placeholder="Ej. RSI Momentum">
      </label>
      <div class="row2">
        <label>Mercado
          <input type="text" name="market" maxlength="60" placeholder="Cripto, acciones, forex…">
        </label>
        <label>Temporalidad
          <input type="text" name="timeframe" maxlength="40" placeholder="Diario, 1h, scalping…">
        </label>
      </div>
      <label>Descripción
        <textarea name="description" maxlength="2000" rows="4" placeholder="¿Qué hace el bot y para quién es?"></textarea>
      </label>
      <label>Reglas / indicadores
        <textarea name="rules" maxlength="2000" rows="4" placeholder="Ej. compra si RSI&lt;30 y precio sobre EMA200; stop 1.5×ATR…"></textarea>
      </label>
      <label>Resultados / backtest (opcional)
        <textarea name="backtest" maxlength="1000" rows="3" placeholder="Ej. 2024: +18%, máx. drawdown 9%, 120 operaciones…"></textarea>
      </label>
      <button type="submit" class="btn-ink">&gt; publicar bot</button>
    </form>
    <p class="colophon">Comparte solo estrategias propias. No constituye asesoramiento financiero.</p>
  </div>
</body>
</html>
