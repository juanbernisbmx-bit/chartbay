services:
  - type: web
    name: chartbay
    runtime: python
    plan: free
    # IMPORTANTE: el runtime Python de Render no trae Node.js ni Emscripten, así
    # que TODOS los artefactos del front viajan compilados en el repositorio.
    # Antes de cada deploy hay que regenerar los que hayan quedado viejos:
    #
    #   cd quantbay && npm install && npm run build
    #     → web/static/js/quantbay.bundle.js   la app
    #     → web/static/js/quantbay.worker.js   el worker del limpiador de CSV
    #
    #   cd cleaner && make wasm && make wasm-test   (necesita emsdk en el PATH)
    #     → web/static/wasm/csvclean.js         glue de Emscripten
    #     → web/static/wasm/csvclean.wasm       el motor en C++
    #
    # Los dos primeros salen del mismo `npm run build`, que desde que existe el
    # worker corre dos builds de vite y no uno. Olvidarse del segundo no rompe
    # nada de forma visible: el limpiador no encuentra el worker, cae al lector
    # clásico y sigue andando con otro comportamiento. Esa degradación silenciosa
    # es justamente lo que hace que valga la pena listarlos acá.
    #
    # Los de WASM solo hay que regenerarlos cuando cambia el C++ de cleaner/.
    #
    # Migración futura: Docker con python:3.12 + node:20 para build automático.
    buildCommand: pip install -r requirements.txt
    # Un solo worker con hilos: la carga es I/O-bound (Yahoo, Anthropic, FRED),
    # así que los --threads son los que evitan que una request lenta bloquee al
    # resto. Un segundo worker duplicaría pandas/numpy en RAM y el plan free
    # tiene 512 MB. Tampoco usamos --preload: forkear después de importar la app
    # (que abre sqlite en el import, web/app.py:180) es justo el patrón que
    # rompe en local, y no gana nada con un único worker.
    startCommand: gunicorn web.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: SECRET_KEY
        generateValue: true
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
