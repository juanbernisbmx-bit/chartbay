services:
  - type: web
    name: chartbay
    runtime: python
    plan: free
    # IMPORTANTE: el runtime Python de Render no trae Node.js ni Emscripten, así
    # que TODOS los artefactos del front viajan compilados en el repositorio.
    # Antes de cada deploy hay que regenerar los que hayan quedado viejos:
    #
    #   cd quantbay && npm install && npm run build
    #     → web/static/js/quantbay.bundle.js   la app
    #     → web/static/js/quantbay.worker.js   el worker del limpiador de CSV
    #     → web/static/js/quantbay.cleaner.js  la interfaz del Limpiador
    #     → web/static/js/quantbay.pro.worker.js  Pyodide fuera del hilo principal
    # El runtime Pyodide fijado ya está versionado en web/static/vendor/.
    #
    #   cd cleaner && make wasm && make wasm-test   (necesita emsdk en el PATH)
    #     → web/static/wasm/csvclean.js         glue de Emscripten
    #     → web/static/wasm/csvclean.wasm       el motor en C++
    #
    # Los cuatro salen del mismo `npm run build`, que corre cuatro builds de Vite.
    # Olvidarse de cualquiera deja a Render sirviendo un artefacto viejo porque
    # el runtime Python no recompila el frontend.
    #
    # Los de WASM solo hay que regenerarlos cuando cambia el C++ de cleaner/.
    #
    # Migración futura: Docker con Python 3.12 + Node 22 para build automático.
    buildCommand: pip install -r requirements.txt
    # Un solo worker con hilos: los --threads son los que evitan que una request
    # lenta (armar /source.tar.gz o, con Datos encendida, una llamada a FRED o a
    # World Bank) bloquee al resto. Un segundo worker duplicaría la app en RAM y
    # el plan free tiene 512 MB, y además partiría en dos el límite de
    # solicitudes por IP (web/rate_limit.py), que cuenta en la memoria del
    # proceso. Tampoco usamos --preload: forkear después de importar la app no
    # gana nada con un único worker.
    startCommand: gunicorn web.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    # /version es la ruta mas barata del sitio: no renderiza plantillas y
    # responde menos de 200 bytes. Es ademas la unica que prueba algo util
    # —devuelve el commit que esta corriendo—, asi que un health check verde aca
    # significa "arranco Y es el codigo que esperabas". Apuntarlo a "/" haria
    # que Render pagase un render de plantilla por sonda.
    healthCheckPath: /version
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      # Sólo la usa la sección Datos, que hoy está escondida (SECCIONES en
      # web/app.py). Con Datos encendida y sin la clave, la sección lista sus 49
      # indicadores y deja descargar los 12 de World Bank, pero los 37 de FRED
      # quedan desactivados. Es gratis: https://fredaccount.stlouisfed.org/apikeys
      - key: FRED_API_KEY
        sync: false
    # Nada más va acá. ChartBay no tiene login, sesión ni IA: no agregues
    # SECRET_KEY, credenciales ni ANTHROPIC_API_KEY. Una clave de pago en el
    # entorno de un servicio que no la usa es superficie de filtración sin
    # contrapartida.
