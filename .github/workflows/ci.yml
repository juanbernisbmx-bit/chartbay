name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantbay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: quantbay/.nvmrc
          cache: npm
          cache-dependency-path: quantbay/package-lock.json

      - name: Set up Python for numerical reference tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install numerical reference dependencies
        run: python -m pip install -r ../requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit --pretty false

      - name: Build bundles
        run: npm run build

      - name: Verify reproducible bundles
        working-directory: .
        run: |
          git diff --exit-code -- web/static/js
          test -z "$(git status --porcelain --untracked-files=all)"

  providers:
    name: Providers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run provider tests
        run: python tests/test_providers.py

  flask:
    name: Flask app (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install web dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify vendored Pyodide integrity
        run: python scripts/vendor_pyodide.py --check

      - name: Test Flask routes and security
        run: python tests/test_web.py

      - name: Test database pages
        run: |
          python tests/test_economic_database.py
          PYTHONPATH=. python tests/test_database_review.py

  cleaner:
    name: Cleaner (native and WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cleaner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: quantbay/.nvmrc

      - name: Test native cleaner
        run: make test

      - name: Test committed WASM bundle
        run: make wasm-test

  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  data-service:
    name: Data service (Postgres 17 and Deno)
    # Same image as respaldo-datos.yml, which installs the PostgreSQL 17 client the same way.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The tests create a schema per test, and some create roles and databases: postgres is a superuser.
      DATOS_TEST_DATABASE_URL: postgresql://postgres:pruebas@localhost:5432/postgres
      DATOS_PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: servicio_datos/requirements.txt

      - name: Install data service dependencies
        run: python -m pip install -r servicio_datos/requirements.txt

      # The backup tests run pg_dump and pg_restore, which must be at least the server version.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          "$DATOS_PG_BIN/pg_dump" --version

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      - name: Test data service and Supabase functions
        shell: bash
        run: |
          python -m unittest discover -s servicio_datos/tests -t . -v 2>&1 | tee "$RUNNER_TEMP/servicio_datos.log"

      # A missing database, pg_dump or Deno makes tests skip, not fail. Only the real INDEC .xls
      # (DATOS_IPC_ORIGINALES_DIR) are expected to be absent here.
      - name: Check that only the INDEC file tests were skipped
        shell: bash
        run: |
          echo "Skipped: $(grep -c "skipped '" "$RUNNER_TEMP/servicio_datos.log" || true)"
          inesperados=$(grep "skipped '" "$RUNNER_TEMP/servicio_datos.log" | grep -vE "DATOS_IPC_ORIGINALES_DIR|XLS originales" || true)
          if [ -n "$inesperados" ]; then
            echo "::error::Unexpected skipped tests"
            echo "$inesperados"
            exit 1
          fi
